name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same PostgreSQL, roles and test database as on a laptop, so the
      # database tests run here instead of being skipped.
      - run: docker compose up --wait

      - run: pnpm turbo check-types lint test
        env:
          TEST_DATABASE_URL: postgresql://xtrakto_app:xtrakto_app@127.0.0.1:5432/xtrakto_test
          TEST_DATABASE_MIGRATION_URL: postgresql://xtrakto:xtrakto@127.0.0.1:5432/xtrakto_test

      - run: pnpm format:check
